<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SYSTEM LOCKED</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  
  body {
    background: #000;
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    position: relative;
  }

  /* Ma trận chữ nền */
  #matrix {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.15;
  }

  /* Lớp nội dung nổi lên trên */
  .content {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 500px;
  }

  /* Cảnh báo đỏ chớp tắt */
  .alert {
    color: #ff3b30;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 20px;
    animation: blink 1s step-end infinite;
    border: 1px solid #ff3b30;
    padding: 6px 12px;
    border-radius: 4px;
    display: inline-block;
    background: rgba(255, 59, 48, 0.1);
  }

  /* Chữ chính hiệu ứng Glitch */
  h1 {
    font-size: 28px;
    font-weight: bold;
    line-height: 1.3;
    color: #fff;
    text-transform: uppercase;
    position: relative;
    margin-bottom: 24px;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
  }
  h1::before, h1::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }
  h1::before {
    left: 2px;
    text-shadow: -2px 0 #ff3b30;
    animation: glitch-anim-1 2s infinite linear alternate-reverse;
  }
  h1::after {
    left: -2px;
    text-shadow: -2px 0 #32d74b, 2px 2px #0a84ff;
    animation: glitch-anim-2 3s infinite linear alternate-reverse;
  }

  p {
    font-size: 14px;
    color: #888;
    line-height: 1.6;
    margin-bottom: 32px;
    letter-spacing: 1px;
  }

  /* Khung Telegram */
  .tele-box {
    background: #000;
    border: 1px solid #333;
    padding: 16px 20px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: 600;
    color: #32d74b;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 0 15px rgba(50, 215, 75, 0.2);
    position: relative;
    overflow: hidden;
  }
  
  /* Hiệu ứng quét sáng chạy qua Telegram */
  .tele-box::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(50,215,75,0.3), transparent);
    animation: shine 3s infinite;
  }

  .tele-box span {
    font-size: 24px;
  }

  .footer {
    position: fixed;
    bottom: 20px;
    font-size: 12px;
    color: #444;
    z-index: 10;
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 2px;
  }

  /* --- Animations --- */
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  @keyframes shine {
    100% { left: 200%; }
  }

  @keyframes glitch-anim-1 {
    0% { clip-path: inset(20% 0 80% 0); }
    20% { clip-path: inset(60% 0 10% 0); }
    40% { clip-path: inset(40% 0 50% 0); }
    60% { clip-path: inset(80% 0 5% 0); }
    80% { clip-path: inset(10% 0 70% 0); }
    100% { clip-path: inset(30% 0 50% 0); }
  }

  @keyframes glitch-anim-2 {
    0% { clip-path: inset(10% 0 60% 0); }
    20% { clip-path: inset(30% 0 20% 0); }
    40% { clip-path: inset(70% 0 10% 0); }
    60% { clip-path: inset(20% 0 80% 0); }
    80% { clip-path: inset(50% 0 30% 0); }
    100% { clip-path: inset(5% 0 90% 0); }
  }
</style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <div class="content">
    <div class="alert">⚠ CẢNH BÁO XÂM NHẬP</div>
    
    <h1 data-text="BỐ THẰNG NGU ĐÉO GỠ ĐƯỢC ĐÂU">BỐ THẰNG NGU ĐÉO GỠ ĐƯỢC ĐÂU</h1>
    
    <p>HỆ THỐNG ĐÃ BỊ KHÓA CỨNG.<br>NÚT GỠ CẤU HÌNH ĐÃ BỊ VÔ HIỆU HÓA.</p>

    <div class="tele-box">
      <span>💬</span> @nguyentu310
    </div>
  </div>

  <div class="footer">
    😂😂😂
  </div>

  <script>
    // Chặn chuột phải
    document.addEventListener('contextmenu', event => event.preventDefault());
    
    // Chặn vuốt back (Ép lịch sử)
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
        history.go(1);
    };

    // Hiệu ứng mưa ma trận (Matrix)
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = [];
    for (let x = 0; x < columns; x++) drops[x] = 1;

    function draw() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0F0';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = letters.charAt(Math.floor(Math.random() * letters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(draw, 33);
  </script>
</body>
</html>
